version: 2

updates:
  # muse discord bot — pinned base image (ghcr.io/museofficial/muse:2.11.7-yt-dlp)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      patch-minor:
        update-types:
          - "patch"
          - "minor"
