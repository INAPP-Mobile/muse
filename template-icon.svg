<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  
  <!-- Music note (stylized) -->
  <g fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Note stem -->
    <path d="M156 52 L156 148" opacity="0.6"/>
    <path d="M188 60 L188 156" opacity="0.6"/>
    <!-- Note flag -->
    <path d="M156 52 C172 58 180 68 188 60 C196 52 200 52 208 56 L208 72 C200 68 196 68 188 76 C180 84 172 76 156 72 Z" fill="#e94560" opacity="0.8"/>
    <!-- Note head -->
    <ellipse cx="150" cy="160" rx="16" ry="12" fill="#e94560" opacity="0.8" transform="rotate(-15, 150, 160)"/>
    <ellipse cx="182" cy="168" rx="16" ry="12" fill="#e94560" opacity="0.8" transform="rotate(-15, 182, 168)"/>
  </g>
  
  <!-- Sound wave arcs -->
  <g fill="none" stroke="#e94560" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <path d="M68 128 A60 60 0 0 1 68 128" stroke-dasharray="4 12" transform="translate(0,0)"/>
    <path d="M56 128 A72 72 0 0 1 56 128" stroke-dasharray="4 16" transform="translate(0,0)"/>
  </g>
  
  <!-- Horizontal sound waves -->
  <g fill="none" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <path d="M52 100 L76 100"/>
    <path d="M48 116 L80 116"/>
    <path d="M44 132 L84 132"/>
    <path d="M48 148 L80 148"/>
    <path d="M52 164 L76 164"/>
  </g>
  
  <!-- Discord-ish circle accents -->
  <circle cx="92" cy="88" r="6" fill="#e94560" opacity="0.6"/>
  <circle cx="108" cy="76" r="4" fill="#ff6b6b" opacity="0.4"/>
  <circle cx="76" cy="72" r="3" fill="#ff6b6b" opacity="0.3"/>
</svg>
