<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15171A"/>
      <stop offset="100%" stop-color="#5865F2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="120" fill="url(#bg)"/>
  <!-- Beamed eighth notes -->
  <g fill="#FFFFFF">
    <!-- Beam -->
    <path d="M316,240 L586,193 L586,251 L316,298 Z"/>
    <!-- Stems -->
    <rect x="316" y="270" width="30" height="266" rx="15"/>
    <rect x="556" y="228" width="30" height="266" rx="15"/>
    <!-- Note heads -->
    <ellipse cx="266" cy="536" rx="62" ry="46" transform="rotate(-20 266 536)"/>
    <ellipse cx="506" cy="494" rx="62" ry="46" transform="rotate(-20 506 494)"/>
  </g>
  <!-- Accent spindle detail -->
  <g fill="#5865F2">
    <ellipse cx="266" cy="536" rx="18" ry="13" transform="rotate(-20 266 536)"/>
    <ellipse cx="506" cy="494" rx="18" ry="13" transform="rotate(-20 506 494)"/>
  </g>
  <!-- Sound wave bars -->
  <g fill="#FFFFFF" opacity="0.55">
    <rect x="640" y="380" width="26" height="120" rx="13"/>
    <rect x="686" y="340" width="26" height="200" rx="13"/>
    <rect x="134" y="360" width="26" height="160" rx="13"/>
    <rect x="180" y="400" width="26" height="80" rx="13"/>
  </g>
</svg>
